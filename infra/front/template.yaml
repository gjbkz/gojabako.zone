# gojabako.zone の前段（CloudFront）。us-east-1 にデプロイする。
# FunctionCode は render.ts が function.js の中身で置き換える。
AWSTemplateFormatVersion: "2010-09-09"
Description: gojabako.zone front door (CloudFront + CloudFront Function)

Parameters:
  DomainName:
    Type: String
    Default: gojabako.zone
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone of DomainName (only for the certificate's DNS validation record)
  VercelDomain:
    Type: String
    Description: Default domain of the Vercel deployment (e.g. xxx.vercel.app)
  NetlifyDomain:
    Type: String
    Description: Default domain of the Netlify deployment (e.g. xxx.netlify.app)
  FirebaseDomain:
    Type: String
    Description: Default domain of the Firebase Hosting site (e.g. xxx.web.app)
  AwsDomain:
    Type: String
    Description: Domain of the AWS deployment
  LogRetentionInDays:
    Type: Number
    Default: 90
  AlertEmail:
    Type: String
    Description: Email address notified when a deployment target goes down or comes back

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Weighted origin selection with failover, bot blocking, /health, /apphost
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        __FUNCTION_CODE__

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        # originId は function.js の origins と揃える。
        # CloudFront Function が毎リクエスト主・予備を選ぶので、TargetOriginId は既定値でしかない。
        Origins:
          - Id: vercel
            DomainName: !Ref VercelDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: netlify
            DomainName: !Ref NetlifyDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: firebase
            DomainName: !Ref FirebaseDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: aws
            DomainName: !Ref AwsDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # HTML と /apphost はキャッシュしない（Managed-CachingDisabled）。
        DefaultCacheBehavior:
          TargetOriginId: vercel
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        # ファイル名にハッシュの付いたアセットだけキャッシュする（Managed-CachingOptimized）。
        # パスは T007 の静的ビルドの出力先に合わせて直す。
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: vercel
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN

  # Route 53 のフェイルオーバーレコード（Kei が手で管理）のプライマリに付けるヘルスチェック。
  # /health は CloudFront Function が直接返すので、CloudFront 自体の死活だけを見る。
  FrontHealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !GetAtt Distribution.DomainName
        ResourcePath: /health
        EnableSNI: true
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-front"

  # デプロイ先のヘルスチェック。1 分ごとに各デプロイ先の /health を見て、
  # 落ちている先を RouterFunction のコードに書き込んで公開し直す（health.js）。
  # スタックを更新すると RouterFunction は「全部正常」に戻るが、次の実行で書き直される。
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  HealthCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-health"
      RetentionInDays: 14
  HealthCheckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health-check
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:GetFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                Resource: !GetAtt RouterFunction.FunctionARN
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt HealthCheckLogGroup.Arn
  HealthCheckFunction:
    Type: AWS::Lambda::Function
    DependsOn: HealthCheckLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-health"
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt HealthCheckRole.Arn
      Environment:
        Variables:
          FUNCTION_NAME: !Ref RouterFunction
          TOPIC_ARN: !Ref AlertTopic
          # id は function.js の originId と揃える。
          ORIGINS: !Sub '[{"id":"vercel","domain":"${VercelDomain}"},{"id":"netlify","domain":"${NetlifyDomain}"},{"id":"firebase","domain":"${FirebaseDomain}"},{"id":"aws","domain":"${AwsDomain}"}]'
      Code:
        ZipFile: |
          __HEALTH_CODE__
  HealthCheckSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      Targets:
        - Id: health
          Arn: !GetAtt HealthCheckFunction.Arn
  HealthCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthCheckFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthCheckSchedule.Arn

  # アクセスログ（標準ログ v2）を CloudWatch Logs に送る。
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cloudfront/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionInDays
  AccessLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-access-log-delivery"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "delivery.logs.amazonaws.com" },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${AccessLogGroup.Arn}",
              "Condition": { "StringEquals": { "aws:SourceAccount": "${AWS::AccountId}" } }
            }
          ]
        }
  AccessLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      LogType: ACCESS_LOGS
      ResourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  AccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      OutputFormat: json
      DestinationResourceArn: !GetAtt AccessLogGroup.Arn
  AccessLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn: AccessLogGroupPolicy
    Properties:
      DeliverySourceName: !Ref AccessLogSource
      DeliveryDestinationArn: !GetAtt AccessLogDestination.Arn

Outputs:
  DistributionDomainName:
    Description: Alias target for the Route 53 records of DomainName
    Value: !GetAtt Distribution.DomainName
  HealthCheckId:
    Description: Attach to the primary (CloudFront) failover record
    Value: !Ref FrontHealthCheck
  AccessLogGroupName:
    Value: !Ref AccessLogGroup
