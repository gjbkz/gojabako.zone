on:
  deployment_status:
jobs:
  SiteAvailability:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      # Vercel はデプロイの ref にコミット SHA を入れるため github.ref は空になる。
      # デプロイ単位でグループを分け、別 PR のデプロイ同士でキャンセルし合わないようにする。
      group: site-availability-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - id: playwright-version
      run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      id: playwright-cache
      with:
        path: '~/.cache/ms-playwright'
        key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'
    - run: npm ci
    - run: npx playwright install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
    - run: npm run build:meta
    - run: npm run e2e
      env:
        BASE_URL: ${{ github.event.deployment_status.environment_url }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
