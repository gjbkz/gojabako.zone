# gojabako.zone の前段（CloudFront）。us-east-1 にデプロイする。
# FunctionCode は render.ts が function.js の中身で置き換える。
AWSTemplateFormatVersion: "2010-09-09"
Description: gojabako.zone front door (CloudFront + CloudFront Function)

Parameters:
  DomainName:
    Type: String
    Default: gojabako.zone
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone of DomainName
  VercelDomain:
    Type: String
    Description: Default domain of the Vercel deployment (e.g. xxx.vercel.app)
  NetlifyDomain:
    Type: String
    Description: Default domain of the Netlify deployment (e.g. xxx.netlify.app)
  CloudRunDomain:
    Type: String
    Description: Default domain of the Cloud Run service (e.g. xxx.a.run.app)
  AwsDomain:
    Type: String
    Description: Domain of the AWS deployment
  CloudFrontWeight:
    Type: Number
    Default: 0
    Description: Weight of the weighted record that points DomainName at CloudFront. 0 keeps traffic on the existing weighted records.
  LogRetentionInDays:
    Type: Number
    Default: 90

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Weighted origin selection with failover, bot blocking, /health, /apphost
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        __FUNCTION_CODE__

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        # originId は function.js の origins と揃える。
        # CloudFront Function が毎リクエスト主・予備を選ぶので、TargetOriginId は既定値でしかない。
        Origins:
          - Id: vercel
            DomainName: !Ref VercelDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: netlify
            DomainName: !Ref NetlifyDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: cloudrun
            DomainName: !Ref CloudRunDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: aws
            DomainName: !Ref AwsDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # HTML と /apphost はキャッシュしない（Managed-CachingDisabled）。
        DefaultCacheBehavior:
          TargetOriginId: vercel
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        # ファイル名にハッシュの付いたアセットだけキャッシュする（Managed-CachingOptimized）。
        # パスは T007 の静的ビルドの出力先に合わせて直す。
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: vercel
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN

  # 既存の加重レコード（各デプロイ先）と並ぶ加重レコード。
  # CloudFrontWeight を上げ、既存側の重みを 0 にすると切り替わる。戻すときは逆にする。
  RecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      SetIdentifier: cloudfront
      Weight: !Ref CloudFrontWeight
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  RecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      SetIdentifier: cloudfront
      Weight: !Ref CloudFrontWeight
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # アクセスログ（標準ログ v2）を CloudWatch Logs に送る。
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cloudfront/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionInDays
  AccessLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-access-log-delivery"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "delivery.logs.amazonaws.com" },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${AccessLogGroup.Arn}",
              "Condition": { "StringEquals": { "aws:SourceAccount": "${AWS::AccountId}" } }
            }
          ]
        }
  AccessLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      LogType: ACCESS_LOGS
      ResourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  AccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      OutputFormat: json
      DestinationResourceArn: !GetAtt AccessLogGroup.Arn
  AccessLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn: AccessLogGroupPolicy
    Properties:
      DeliverySourceName: !Ref AccessLogSource
      DeliveryDestinationArn: !GetAtt AccessLogDestination.Arn

Outputs:
  DistributionDomainName:
    Description: Test the front with this domain before raising CloudFrontWeight
    Value: !GetAtt Distribution.DomainName
  AccessLogGroupName:
    Value: !Ref AccessLogGroup
