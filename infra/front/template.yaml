# gojabako.zone の前段（CloudFront）。us-east-1 にデプロイする。
# FunctionCode は render.ts が function.js の中身で置き換える。
AWSTemplateFormatVersion: "2010-09-09"
Description: gojabako.zone front door (CloudFront + CloudFront Function)

Parameters:
  DomainName:
    Type: String
    Default: gojabako.zone
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone of DomainName
  VercelDomain:
    Type: String
    Description: Default domain of the Vercel deployment (e.g. xxx.vercel.app)
  NetlifyDomain:
    Type: String
    Description: Default domain of the Netlify deployment (e.g. xxx.netlify.app)
  FirebaseDomain:
    Type: String
    Description: Default domain of the Firebase Hosting site (e.g. xxx.web.app)
  AwsDomain:
    Type: String
    Description: Domain of the AWS deployment
  DnsMode:
    Type: String
    Default: weighted
    AllowedValues: [weighted, failover]
    Description: weighted while migrating from the existing weighted records, failover afterwards
  CloudFrontWeight:
    Type: Number
    Default: 0
    Description: (weighted) Weight of the record that points DomainName at CloudFront. 0 keeps traffic on the existing weighted records.
  SecondaryARecords:
    Type: CommaDelimitedList
    Default: ""
    Description: (failover) A record values of the secondary host that serves DomainName directly (e.g. Vercel's apex IP)
  LogRetentionInDays:
    Type: Number
    Default: 90

Conditions:
  IsWeighted: !Equals [!Ref DnsMode, weighted]
  IsFailover: !Equals [!Ref DnsMode, failover]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Weighted origin selection with failover, bot blocking, /health, /apphost
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        __FUNCTION_CODE__

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        # originId は function.js の origins と揃える。
        # CloudFront Function が毎リクエスト主・予備を選ぶので、TargetOriginId は既定値でしかない。
        Origins:
          - Id: vercel
            DomainName: !Ref VercelDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: netlify
            DomainName: !Ref NetlifyDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: firebase
            DomainName: !Ref FirebaseDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: aws
            DomainName: !Ref AwsDomain
            ConnectionAttempts: 1
            ConnectionTimeout: 2
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # HTML と /apphost はキャッシュしない（Managed-CachingDisabled）。
        DefaultCacheBehavior:
          TargetOriginId: vercel
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        # ファイル名にハッシュの付いたアセットだけキャッシュする（Managed-CachingOptimized）。
        # パスは T007 の静的ビルドの出力先に合わせて直す。
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: vercel
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN

  # DnsMode=weighted（移行中）: 既存の加重レコード（各デプロイ先）と並ぶ加重レコード。
  #   CloudFrontWeight を上げ、既存側の重みを 0 にすると切り替わる。戻すときは逆にする。
  # DnsMode=failover（移行後）: A レコードはプライマリが CloudFront、セカンダリがデプロイ先 1 つ。
  #   CloudFront の /health が落ちたら Route 53 がセカンダリを返す。
  #   切り替える前に、CloudFront 以外の既存の加重レコードを消しておく（同じ名前・種類で加重とフェイルオーバーは混在できない）。
  #   セカンダリのデプロイ先には DomainName の独自ドメイン設定を残しておく。
  FrontHealthCheck:
    Type: AWS::Route53::HealthCheck
    Condition: IsFailover
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !GetAtt Distribution.DomainName
        ResourcePath: /health
        EnableSNI: true
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-front"
  # 1 つの RecordSetGroup にまとめ、weighted → failover の入れ替えを 1 回の変更（アトミック）で行う。
  Records:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - !If
          - IsWeighted
          - Name: !Ref DomainName
            Type: A
            SetIdentifier: cloudfront
            Weight: !Ref CloudFrontWeight
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
          - Name: !Ref DomainName
            Type: A
            SetIdentifier: cloudfront
            Failover: PRIMARY
            HealthCheckId: !Ref FrontHealthCheck
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
        - !If
          - IsWeighted
          - Name: !Ref DomainName
            Type: AAAA
            SetIdentifier: cloudfront
            Weight: !Ref CloudFrontWeight
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
          # IPv6 は CloudFront だけに向ける。CloudFront が落ちたときは、ブラウザーが IPv4（A のセカンダリ）に回る想定。
          - Name: !Ref DomainName
            Type: AAAA
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
        - !If
          - IsFailover
          - Name: !Ref DomainName
            Type: A
            SetIdentifier: secondary
            Failover: SECONDARY
            TTL: "60"
            ResourceRecords: !Ref SecondaryARecords
          - !Ref AWS::NoValue

  # アクセスログ（標準ログ v2）を CloudWatch Logs に送る。
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cloudfront/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionInDays
  AccessLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-access-log-delivery"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "delivery.logs.amazonaws.com" },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${AccessLogGroup.Arn}",
              "Condition": { "StringEquals": { "aws:SourceAccount": "${AWS::AccountId}" } }
            }
          ]
        }
  AccessLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      LogType: ACCESS_LOGS
      ResourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  AccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${AWS::StackName}-access-log"
      OutputFormat: json
      DestinationResourceArn: !GetAtt AccessLogGroup.Arn
  AccessLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn: AccessLogGroupPolicy
    Properties:
      DeliverySourceName: !Ref AccessLogSource
      DeliveryDestinationArn: !GetAtt AccessLogDestination.Arn

Outputs:
  DistributionDomainName:
    Description: Test the front with this domain before raising CloudFrontWeight
    Value: !GetAtt Distribution.DomainName
  AccessLogGroupName:
    Value: !Ref AccessLogGroup
